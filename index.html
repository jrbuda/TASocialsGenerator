<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>The Archives | Graphic Generator</title>
    <!-- Shared The Archives icon (TA emblem), same artwork as thearchiveslol.com.
         The ?v= is a cache key: Cloudflare holds /favicon.ico for 4 h, so bump
         this version whenever the repo's favicon.ico is replaced. -->
    <link rel="icon" href="./favicon.ico?v=2" sizes="any">
    <link rel="apple-touch-icon" href="./apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
    <link rel="stylesheet" href="./styles.css?v=3">
</head>

<body>
    <div class="app">
        <aside>
            <h1>Match information</h1>
            <div class="field">
                <label for="division">Division</label>
                <input id="division" value="ELDER" autocomplete="off">
            </div>
            <div class="field">
                <label for="stageText">Stage text (matchup and spoiler)</label>
                <input id="stageText" value="Swiss Stage" autocomplete="off">
            </div>

            <h1>Team 1</h1>
            <div class="field">
                <input id="team1Name" value="AEON FORGE" autocomplete="off">
            </div>
            <div class="field">
                <label for="team1LogoUrl">Logo URL</label>
                <input id="team1LogoUrl" type="url" placeholder="https://example.com/logo.png">
            </div>
            <div class="field">
                <label for="team1LogoFile">Or upload a logo (takes priority over URL)</label>
                <input id="team1LogoFile" type="file" accept="image/png,image/jpeg,image/webp,image/gif,image/svg+xml">
            </div>

            <h1>Team 2</h1>
            <div class="field">
                <input id="team2Name" value="AEON AETHER" autocomplete="off">
            </div>
            <div class="field">
                <label for="team2LogoUrl">Logo URL</label>
                <input id="team2LogoUrl" type="url" placeholder="https://example.com/logo.png">
            </div>
            <div class="field">
                <label for="team2LogoFile">Or upload a logo (takes priority over URL)</label>
                <input id="team2LogoFile" type="file" accept="image/png,image/jpeg,image/webp,image/gif,image/svg+xml">
            </div>

            <h2>Final score</h2>
            <div class="fields-two">
                <div class="field">
                    <label for="team1Score">Team 1</label>
                    <input id="team1Score" type="number" min="0" step="1" value="2">
                </div>
                <div class="field">
                    <label for="team2Score">Team 2</label>
                    <input id="team2Score" type="number" min="0" step="1" value="1">
                </div>
            </div>

            <div class="button-grid">
                <button id="exportMatchupBtn" type="button">Export matchup PNG</button>
                <button id="exportSpoilerBtn" type="button">Export spoiler PNG</button>
                <button id="exportResultsBtn" type="button">Export results PNG</button>
                <button id="exportAllBtn" class="primary" type="button">Export all 3 as ZIP</button>
            </div>
        </aside>

        <main>
            <div class="toolbar">
                <div class="preview-tabs" role="group" aria-label="Choose a preview">
                    <button type="button" class="active" data-preview="matchup" aria-pressed="true">Matchup</button>
                    <button type="button" data-preview="spoiler" aria-pressed="false">Spoiler Warning</button>
                    <button type="button" data-preview="results" aria-pressed="false">Results</button>
                </div>
                <span id="status" role="status" aria-live="polite">Loading template and font…</span>
            </div>
            <div class="preview-frame">
                <div class="preview-stage" id="previewStage">
                    <canvas id="previewCanvas" width="1024" height="1024" aria-label="Graphic preview"></canvas>
                    <div class="preview-hotspots" id="previewHotspots" aria-label="Edit preview elements"></div>
                    <form class="edit-popover" id="editPopover" hidden aria-label="Edit graphic text">
                        <div id="popoverInputs"></div>
                        <div class="popover-actions">
                            <button type="button" id="popoverCancel">Cancel</button>
                            <button type="submit" class="save">Apply</button>
                        </div>
                    </form>
                </div>
            </div>
            <p class="preview-help">Click a name, division, stage label, or result score to edit it. Click a logo to
                upload, or drag and drop an image or image URL onto it. Names over 18 characters wrap onto two lines.
            </p>
        </main>
    </div>

    <script type="module" src="./app.js?v=3"></script>
</body>

</html>
